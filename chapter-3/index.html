<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calendar · Adam Dab</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="../_lib/calendar.js" defer></script>
  </head>
  <body>
    <main class="page">
      <h1>Calendar</h1>
      <div class="calendar-heading">
        <button class="demo-button" id="previous-month" type="button" aria-label="Previous month">←</button>
        <h2 id="month-label" aria-live="polite"></h2>
        <button class="demo-button" id="next-month" type="button" aria-label="Next month">→</button>
      </div>
      <table class="calendar" aria-labelledby="month-label">
        <thead>
          <tr>
            <th scope="col">Mon</th><th scope="col">Tue</th><th scope="col">Wed</th>
            <th scope="col">Thu</th><th scope="col">Fri</th><th scope="col">Sat</th><th scope="col">Sun</th>
          </tr>
        </thead>
        <tbody id="calendar-days"></tbody>
      </table>
    </main>
  </body>
</html>
