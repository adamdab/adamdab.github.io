<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Warsaw weather · Adam Dab</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="../_lib/weather.js" defer></script>
  </head>
  <body>
    <main class="page">
      <h1>Weather in Warsaw</h1>
      <p id="weather-status" role="status">Loading current weather…</p>
      <section class="weather-card" id="weather-card" aria-label="Current weather in Warsaw" hidden>
        <p class="weather-temperature"><span id="temperature"></span><span aria-hidden="true">°C</span></p>
        <p class="weather-condition" id="condition"></p>
        <dl class="weather-details">
          <div><dt>Feels like</dt><dd><span id="apparent-temperature"></span>°C</dd></div>
          <div><dt>Humidity</dt><dd><span id="humidity"></span>%</dd></div>
          <div><dt>Wind</dt><dd><span id="wind-speed"></span> km/h</dd></div>
          <div><dt>Precipitation</dt><dd><span id="precipitation"></span> mm</dd></div>
        </dl>
        <p class="weather-time">Updated <time id="weather-time"></time> Warsaw time</p>
      </section>
      <button class="demo-button" id="refresh-weather" type="button">Refresh</button>
      <p class="weather-credit">Weather data by <a href="https://open-meteo.com/">Open-Meteo</a>.</p>
    </main>
  </body>
</html>
